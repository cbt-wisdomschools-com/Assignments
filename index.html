        .login-container {
             background-color: rgba(200,200,200,0.4);
         
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;

        }
        
        .header {
            background: linear-gradient(135deg, gold 0%, white 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            background-image: url("img/computerlab1.jpg");
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .school-name {
            font-size: 28px;
            font-weight: bold;

        }
        
        .motto {
            font-size: 16px;
            color: #ffc107;
            font-style: italic;
            margin-bottom: 5px;
        }
        
        .tagline {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .login-form {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 15px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #004a8f;
            box-shadow: 0 0 0 3px rgba(0, 74, 143, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #004a8f, #003366);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            background: linear-gradient(to right, #003366, #002b5c);
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.2);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
            }
            
            .login-form {

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            // Validate inputs
            if (!username || !password) {
                errorMessage.textContent = "Please enter both username and password.";
                return;
            }
            
            // Check credentials
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                // Store user data in sessionStorage
                sessionStorage.setItem('username', user.name);
                sessionStorage.setItem('image', user.image);
                sessionStorage.setItem('userClass', user.class);
                sessionStorage.setItem('loggedIn', 'true');
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorMessage.textContent = "Invalid username or password. Please try again.";
            }
        });
        
        // Clear error message when user starts typing
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').textContent = '';
        });
        
        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').textContent = '';
        });
